[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "jp-cultural-data-mcp"
version = "0.1.0"
description = "国立国会図書館、ジャパンサーチ、メディア芸術データベースの資料を調べるMCPサーバーです。"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.28.1,<1",
  "mcp>=2.2.0,<3",
  "pydantic>=2.13.5,<3",
]

[project.scripts]
jp-cultural-data-mcp = "jp_cultural_data_mcp.__main__:main"
ndl-search-mcp = "ndl_search_mcp.__main__:main"
japan-search-mcp = "japan_search_mcp.__main__:main"
mediaarts-db-mcp = "mediaarts_db_mcp.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "respx>=0.22.0",
  "ruff>=0.16.9",
  "ty>=0.0.84",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/jp_cultural_data_mcp", "src/ndl_search_mcp", "src/japan_search_mcp", "src/mediaarts_db_mcp"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

addopts = "--import-mode=importlib"
